 feedback into product changes.","Deployed a GPT-4o assistant grounded in live data through one snapshot pipeline that the UI, the operations views and the AI all read. The AI recommends and never writes to business state.","Measured outcomes, not features: move-in risk is flagged up to 3 business days early, leasing staff answer unit-readiness questions themselves, and leadership sees live portfolio status instead of manual reports."]},"systems":[{"title":"Hers RD, collaborative SaaS product","text":"Co-defined an RC racing product with a senior AWS engineer. I owned product definition (21 features, 10 domains, 12 API contracts), the data model and the database foundation (a merged 3,066-line schema and migrations change), and built the proof of concept. He owned the AWS infrastructure.","key":"hers"},{"title":"mg-agent, governed AI agent platform","text":"Typed capabilities, approval gates, 8 engine adapters, and a replay harness that tests the platform with the model held constant, including rejection of false claims of completion. 666 passing tests in the November 2026 run.","key":"mgagent"}]},{"id":"operations","file":"Miguel_Gonzalez_Resume_Operations.docx","label":"Operations","for":"Regional or senior maintenance and operations roles in property management","headline":"Senior Operations Leader | Multifamily Make-Ready & Maintenance","summary":["Operations leader with 10+ years in multifamily maintenance and make-ready. Currently responsible for 2,444 units across six phases, each operated as its own property, leading a 7-person organization that includes two assistant managers, and coordinating outside vendors.","Managed a $1M+ operating budget and $5M+ in capital projects, and took an over-budget operation to roughly $30K under budget in a single month. Currently managing a unit renovation program alongside daily operations. I build the tools my teams run on, including an operations platform that flags move-in risk days early."],"sections":["summary","capabilities","experience","product","education"],"capabilities":[{"label":"Operations","items":"SLA and KPI design, rules-engine design, budget management, vendor coordination, automated dispatch, Yardi, RealPage"},{"label":"Leadership","items":"Leading managers, coordinators and technicians, vendor management, budget ownership, hiring and training, reporting to leadership"}],"product":{"title":"Make-Ready Intelligence Platform (DMRB)","heading":"Systems I Built","tag":"Built on my own time","intro":"Operations platform for apartment unit turns, proven in a live 2,444-unit operation with 15 daily users.","bullets":["Designed and built an operations platform that tracks every unit through its turn and became the team's daily system of record for scheduling, vendor dispatch and SLA tracking.","Its rules engine flags move-in risk up to 3 business days early, and a GPT-4o assistant answers unit-readiness questions from live data."]},"systems":[]}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("resume-data").textContent);
  const root = document.getElementById("resume");
  const tabs = document.getElementById("variant-tabs");
  const hint = document.getElementById("variant-hint");
  const download = document.getElementById("download-word");
  const portfolio = document.getElementById("portfolio-link");
  portfolio.href = DATA.links.site;

  const esc = (s) => String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  function shortLabel(label) {
    const map = {
      "Product & Deployment": "Product",
      "AI Implementation": "AI",
      "Architecture": "Architecture",
      "Operations": "Operations",
      "Leadership": "Leadership",
      "Program Delivery": "Delivery",
      "Customer & Implementation": "Customer"
    };
    return map[label] || label;
  }

  function sectionSummary(v) {
    return `<section aria-labelledby="summary">
      <h2 id="summary">Summary</h2>
      ${v.summary.map((p) => `<p>${esc(p)}</p>`).join("")}
    </section>`;
  }

  function sectionCapabilities(v) {
    return `<section aria-labelledby="capabilities">
      <h2 id="capabilities">Core Capabilities</h2>
      <div class="caps">
        ${v.capabilities.map((c) => `<div class="cap">
          <span class="cap-label">${esc(shortLabel(c.label))}</span>
          <p class="cap-body">${esc(c.items)}</p>
        </div>`).join("")}
      </div>
    </section>`;
  }

  function sectionProduct(v) {
    return `<section aria-labelledby="case-study">
      <h2 id="case-study">${esc(v.product.heading)}</h2>
      <div class="case-head">
        <h3>${esc(v.product.title)}</h3>
        <span class="tag">${esc(v.product.tag)}</span>
      </div>
      <p class="intro">${esc(v.product.intro)}</p>
      <ul>${v.product.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
    </section>`;
  }

  function sectionSystems(v) {
    if (!v.systems.length) return "";
    return `<section aria-labelledby="systems">
      <h2 id="systems">Other Systems</h2>
      ${v.systems.map((s) => `<p class="sys"><b>${esc(s.title)}.</b> ${esc(s.text)}</p>`).join("")}
    </section>`;
  }

  function sectionExperience() {
    const jobs = DATA.experience.map((job) => {
      const roles = job.roles.map((r, i) => `<div class="role">
        <h3>${esc(r.title)}${i === 0 ? ` <span class="where">| ${esc(job.company)}, ${esc(job.location)}</span>` : ""}</h3>
        <span class="dates">${esc(r.dates)}</span>
      </div>`).join("");
      const bullets = job.bullets.length
        ? `<ul>${job.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>`
        : "";
      return `<div class="job">${roles}${bullets}</div>`;
    }).join("");
    return `<section aria-labelledby="experience">
      <h2 id="experience">Professional Experience</h2>
      ${jobs}
      <p class="muted" style="margin-top:16px"><b>Earlier roles:</b> ${esc(DATA.earlierRoles)}</p>
    </section>`;
  }

  function sectionEducation() {
    return `<section class="edu" aria-labelledby="education">
      <h2 id="education">Education &amp; Certifications</h2>
      ${DATA.education.map((e) => `<p>${esc(e)}</p>`).join("")}
    </section>`;
  }

  const builders = {
    summary: sectionSummary,
    capabilities: sectionCapabilities,
    product: sectionProduct,
    systems: sectionSystems,
    experience: () => sectionExperience(),
    education: () => sectionEducation()
  };

  function render(variant) {
    const phoneHref = "tel:+1" + DATA.phone.replace(/\D/g, "");
    const body = variant.sections.map((key) => (builders[key] ? builders[key](variant) : "")).join("");
    root.innerHTML = `
      <header>
        <h1>${esc(DATA.name)}</h1>
        <p class="headline">${esc(variant.headline)}</p>
        <div class="contact">
          <span>${esc(DATA.location)}</span>
          <a href="${phoneHref}">${esc(DATA.phone)}</a>
          <a href="mailto:${esc(DATA.email)}">${esc(DATA.email)}</a>
          <a href="${esc(DATA.links.linkedin)}">LinkedIn</a>
          <a href="${esc(DATA.links.github)}">GitHub</a>
        </div>
      </header>
      ${body}`;

    download.href = variant.file;
    download.setAttribute("download", variant.file);
    download.title = "Download " + variant.label + " Word resume";
    hint.textContent = "Best for: " + variant.for;
    document.title = DATA.name + " | " + variant.label + " Resume";
    document.querySelector('meta[name="description"]').setAttribute(
      "content",
      variant.headline + ". " + DATA.shortBio
    );

    tabs.querySelectorAll(".seg").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.id === variant.id ? "true" : "false");
    });
  }

  function select(id, push) {
    const variant = DATA.variants.find((v) => v.id === id) || DATA.variants[0];
    render(variant);
    if (push) {
      const url = new URL(window.location.href);
      url.searchParams.set("v", variant.id);
      history.replaceState(null, "", url);
    }
  }

  DATA.variants.forEach((v) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "seg";
    btn.dataset.id = v.id;
    btn.textContent = v.label;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", () => select(v.id, true));
    tabs.appendChild(btn);
  });

  const params = new URLSearchParams(window.location.search);
  const initial = params.get("v") || "implementation";
  select(initial, false);
})();
</script>
</body>
</html>
